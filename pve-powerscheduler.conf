# ==============================================================================
# Proxmox PowerScheduler - Configuration File
# Path: /etc/pve-powerscheduler/pve-powerscheduler.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 🖥️ TARGET GUESTS (LXC / VM)
# ------------------------------------------------------------------------------
# Enable power scheduling for QEMU/KVM Virtual Machines (VMs) in addition to LXCs.
# Set to "true" to include VMs, or "false" to manage LXC containers only. (Default: false)
ENABLE_VMS=false

# ------------------------------------------------------------------------------
# ⏰ WEEKLY SCHEDULE (24h format HH:MM)
# ------------------------------------------------------------------------------
# Configure individual START (wake-up) and STOP (shutdown) times for each weekday.
#
# Examples:
#   MON_START="08:00"   # Guests wake up Monday morning at 08:00
#   MON_STOP="22:30"    # Guests shut down Monday evening at 22:30
#
# Overnight spans:
#   If a STOP time is earlier than the START time (e.g. FRI_STOP="03:00"), the system
#   stays active past midnight until that time the following morning.

# Monday
MON_START="08:00"
MON_STOP="22:30"

# Tuesday
TUE_START="08:30"
TUE_STOP="22:30"

# Wednesday
WED_START="08:00"
WED_STOP="22:30"

# Thursday
THU_START="08:00"
THU_STOP="22:30"

# Friday (stays active through Friday night until 03:00 Saturday morning)
FRI_START="08:00"
FRI_STOP="03:00"

# Saturday (stays active through Saturday night until 03:00 Sunday morning)
SAT_START="09:00"
SAT_STOP="03:00"

# Sunday
SUN_START="09:00"
SUN_STOP="22:30"

# ------------------------------------------------------------------------------
# ⏳ DELAYS (in seconds)
# ------------------------------------------------------------------------------
# Delay between priority stages (Default: 5 seconds)
# Flow: power-start-first -> wait STAGE_DELAY_SECONDS -> Default -> wait STAGE_DELAY_SECONDS -> power-start-last
STAGE_DELAY_SECONDS=5

# Delay between starting individual guests within a stage (avoids I/O spikes, Default: 2 seconds)
START_DELAY_SECONDS=2

# ------------------------------------------------------------------------------
# 🏷️ PROXMOX TAGS
# ------------------------------------------------------------------------------
# 1. EXCLUSION TAG (Blacklist)
# Guests with this tag will NEVER be automatically stopped or started (e.g. DNS, Home Assistant).
TAG_IGNORE="power-ignore"

# 2. START TAGS (Wake-up Sequence)
# Flow: power-start-first -> wait -> Default (untagged) -> wait -> power-start-last
#
# Started BEFORE all other guests (e.g. databases, storage backends)
TAG_START_FIRST="power-start-first"
# Started AFTER all other guests (e.g. web frontends, dependent workers)
TAG_START_LAST="power-start-last"
# (Note: All guests without a start tag start in the middle as 'Default')

# 3. STOP TAGS (Shutdown Sequence)
# Flow: power-stop-first -> wait -> Default (untagged) -> wait -> power-stop-last
#
# Stopped BEFORE all other guests (e.g. web frontends, ingress proxies)
TAG_STOP_FIRST="power-stop-first"
# Stopped AFTER all other guests (e.g. core databases, storage backends)
TAG_STOP_LAST="power-stop-last"
# (Note: All guests without a stop tag stop in the middle as 'Default')